<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0f1012">
<title>안개등 — 등대지기가 남긴 서른 개의 암호</title>
<meta name="description" content="사물을 빛에 겹쳐 글자를 찾고, 등대지기가 남긴 서른 개의 암호를 해독하는 퍼즐 게임.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1012; --bg2:#16181b; --panel:#1b1d21; --line:#2a2d33; --ink:#d8d5cf; --ink2:#8f8c86; --ink3:#5a5852;
  --amber:#e8a94a; --amber2:#f6c976; --amber-dim:rgba(232,169,74,.18); --danger:#c46a5a;
  --font:'Gowun Batang','Noto Serif KR','Apple SD Gothic Neo','Malgun Gothic',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);letter-spacing:.01em;font-size:15px}
body{position:fixed;inset:0;width:100%;height:100dvh}
button{font-family:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;letter-spacing:.06em;font-size:13px;line-height:1.2}
button:active{transform:translateY(1px)}
button:disabled{opacity:.3;cursor:default}
button.primary{border-color:var(--amber);color:var(--amber)}
button.on{background:var(--amber-dim);border-color:var(--amber);color:var(--amber2)}
canvas{display:block;image-rendering:pixelated}
.fog{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(ellipse 60% 50% at 20% 110%, rgba(255,255,255,.05), transparent 60%),
  radial-gradient(ellipse 70% 40% at 80% -10%, rgba(255,255,255,.04), transparent 60%);
  animation:fogmove 40s ease-in-out infinite alternate}
@keyframes fogmove{from{transform:translateX(-2%)}to{transform:translateX(2%)}}
#app{position:absolute;inset:0;display:none;grid-template-rows:44px 1fr;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app.show{display:grid}
/* top bar */
#top{display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--bg2)}
#top .title{font-weight:700;letter-spacing:.2em;color:var(--amber);font-size:15px}
#top .stage{color:var(--ink2);letter-spacing:.08em;font-size:13px}
#top .act{color:var(--ink3);font-size:12px;letter-spacing:.12em}
#top .sp{flex:1}
#top button{padding:4px 9px;font-size:12px}
/* main */
#main{display:grid;grid-template-columns:minmax(200px,27%) 1fr minmax(240px,31%);min-height:0}
.col{min-height:0;display:flex;flex-direction:column;padding:10px 12px;gap:8px}
.col h3{margin:0;font-size:11px;letter-spacing:.3em;color:var(--ink3);font-weight:400}
#shelfCol{border-right:1px solid var(--line)}
#noteCol{border-left:1px solid var(--line)}
/* shelf */
#shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(60px,7.5vw,96px),1fr));gap:6px;align-content:start;overflow:hidden;flex:1;min-height:0}
.obj{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px 4px;border:1px solid transparent;border-radius:8px;cursor:pointer;background:transparent}
.obj:active{background:var(--bg2)}
.obj.inA,.obj.inB{border-color:var(--ink3)}
.obj.kept{border-style:dashed;border-color:var(--amber-dim)}
.obj .nm{font-size:11px;color:var(--ink2);letter-spacing:.05em;white-space:nowrap}
.obj.kept .nm{color:var(--amber)}
.obj canvas{width:clamp(36px,6vh + 1vw,64px);height:clamp(36px,6vh + 1vw,64px)}
/* bench */
#benchCol{align-items:center;justify-content:center;gap:8px}
#board{position:relative;border:1px solid var(--line);border-radius:10px;padding:8px;background:radial-gradient(ellipse at 50% 40%, #1a1a1d, #0f1012 75%)}
#board canvas{width:min(38vh,300px);height:min(38vh,300px)}
#board.flash{box-shadow:0 0 40px 6px rgba(232,169,74,.35);border-color:var(--amber)}
#dots{display:flex;gap:7px;justify-content:center;height:10px}
#dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block;transition:background .2s,box-shadow .2s}
#dots i.on{background:var(--amber);box-shadow:0 0 6px var(--amber)}
#slots{display:flex;align-items:center;gap:8px}
.slot{width:clamp(54px,10vh,84px);height:clamp(54px,10vh,84px);border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.slot.sel{border-style:solid;border-color:var(--amber)}
.slot canvas{width:70%;height:70%}
.slot .lbl{position:absolute;top:2px;left:5px;font-size:10px;color:var(--ink3)}
.slot .nm{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:10px;color:var(--ink3);white-space:nowrap}
#opBox{display:flex;flex-direction:column;gap:4px}
#opBox button{padding:4px 8px;font-size:12px;letter-spacing:.1em}
#tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
#tools button{padding:5px 9px;font-size:12px}
#keep{margin-top:2px}
/* note */
#note{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;overflow:hidden}
#prev{color:var(--ink3);font-size:12px;line-height:1.7;letter-spacing:.03em;word-break:keep-all;max-height:7.5em;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
#prev div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#line{font-size:17px;line-height:2.1;letter-spacing:.06em;word-break:keep-all;color:var(--ink)}
.syl{display:inline-flex;vertical-align:middle;margin:0 2px;gap:1px;border:1px solid var(--ink3);border-radius:5px;padding:2px 3px;cursor:pointer;height:34px;align-items:center}
.syl .js{width:16px;height:26px;border-radius:3px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--amber2);line-height:1}
.syl .js.sel{outline:1px solid var(--amber);background:var(--amber-dim)}
.syl.ok{border-color:var(--amber)}
.syl.done{border:none;padding:0;margin:0;color:var(--amber2);font-size:17px;height:auto;display:inline}
#tray{display:flex;flex-wrap:wrap;gap:5px;min-height:34px;align-content:flex-start}
.jm{width:30px;height:30px;border:1px solid var(--amber);color:var(--amber2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;background:var(--amber-dim);line-height:1}
.jm.sel{background:var(--amber);color:#1a1206}
.jm.new{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.4)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
#noteBtns{display:flex;gap:6px;align-items:center}
#msg{font-size:12px;color:var(--ink2);letter-spacing:.05em;min-height:1.4em;line-height:1.4;word-break:keep-all}
#msg.bad{color:var(--danger)}
#msg.good{color:var(--amber)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* overlays */
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,10,12,.92);z-index:20;padding:20px}
.ov.show{display:flex}
.card{max-width:640px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.card h1{margin:0;font-size:38px;letter-spacing:.5em;color:var(--amber);font-weight:700;text-indent:.5em}
.card .sub{color:var(--ink2);letter-spacing:.2em;font-size:13px}
.card p{margin:0;line-height:1.9;letter-spacing:.06em;word-break:keep-all;color:var(--ink);max-width:520px;font-size:15px}
.card .teach{border:1px solid var(--amber-dim);border-radius:8px;padding:8px 14px;color:var(--amber2);font-size:13px;letter-spacing:.06em;line-height:1.7;word-break:keep-all;max-width:520px}
.card .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card button{padding:9px 18px;font-size:14px}
.card canvas{height:min(30vh,180px);width:auto;max-width:90vw}
.card .sceneTitle{font-size:12px;letter-spacing:.4em;color:var(--ink3)}
#rotate{display:none;position:absolute;inset:0;background:var(--bg);z-index:50;align-items:center;justify-content:center;text-align:center;color:var(--ink2);letter-spacing:.1em;line-height:2;padding:20px;word-break:keep-all}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
#menu .card{gap:10px}
#menu .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.small{font-size:12px;color:var(--ink3);letter-spacing:.06em}
@media (max-height:420px){#top{height:38px}#app{grid-template-rows:38px 1fr}#line{font-size:15px}.obj canvas{width:32px;height:32px}.obj{padding:3px 2px 2px}#board canvas{width:min(30vh,200px);height:min(30vh,200px)}.slot{width:54px;height:54px}.card h1{font-size:28px}.card p{font-size:13px;line-height:1.6}.card{gap:8px}.card .teach{font-size:12px;line-height:1.5;padding:6px 10px}.card .sceneTitle{display:none}.card .btns button{padding:6px 14px}.ov{padding:10px 20px}}
</style>
</head>
<body>
<div class="fog"></div>
<div id="rotate"><div>안개등은 가로 화면에서 켜집니다.<br><span class="small">기기를 옆으로 돌려 주세요.</span></div></div>

<div id="app">
  <div id="top">
    <span class="title">안개등</span>
    <span class="stage" id="stageLbl"></span>
    <span class="act" id="actLbl"></span>
    <span class="sp"></span>
    <button id="hintBtn">힌트</button>
    <button id="soundBtn">소리</button>
    <button id="fsBtn">전체화면</button>
    <button id="menuBtn">메뉴</button>
  </div>
  <div id="main">
    <div class="col" id="shelfCol"><h3>탁자 위의 물건</h3><div id="shelf"></div></div>
    <div class="col" id="benchCol">
      <div id="board"><canvas id="boardCv" width="7" height="7"></canvas></div>
      <div id="dots"></div>
      <div id="slots">
        <div class="slot" id="slotA"><span class="lbl">앞</span><canvas width="7" height="7"></canvas><span class="nm"></span></div>
        <div id="opBox"></div>
        <div class="slot" id="slotB"><span class="lbl">뒤</span><canvas width="7" height="7"></canvas><span class="nm"></span></div>
      </div>
      <div id="tools"></div>
    </div>
    <div class="col" id="noteCol"><h3>등대지기의 일기</h3>
      <div id="note">
        <div id="prev"></div>
        <div id="line"></div>
        <div id="tray"></div>
        <div id="noteBtns"><button id="decodeBtn" class="primary">해독</button><button id="clearBtn">비우기</button></div>
        <div id="msg"></div>
      </div>
    </div>
  </div>
</div>

<div class="ov show" id="start"><div class="card">
  <h1>안개등</h1>
  <div class="sub">등대지기가 남긴 서른 개의 암호</div>
  <p>폐쇄된 등대에서 일기 한 권이 발견되었다. 글자는 안개에 지워졌고, 탁자 위의 물건들만 남았다.<br>물건을 빛에 겹쳐 보면, 글자가 돌아온다.</p>
  <div class="btns"><button class="primary" id="startBtn">처음부터</button><button id="contBtn">이어서</button><button id="fsBtn2">전체화면</button></div>
  <div class="small">소리를 켜고 하기를 권합니다 · 가로 화면</div>
</div></div>

<div class="ov" id="scene"><div class="card">
  <div class="sceneTitle" id="sceneTitle"></div>
  <canvas id="sceneCv"></canvas>
  <p id="sceneText"></p>
  <div class="teach" id="sceneTeach"></div>
  <div class="btns"><button class="primary" id="sceneBtn">계속</button></div>
</div></div>

<div class="ov" id="menu"><div class="card">
  <h1 style="font-size:24px">안개등</h1>
  <div class="small" id="menuInfo"></div>
  <div class="row"><button id="resumeBtn" class="primary">돌아가기</button><button id="restartStageBtn">이 단계 다시</button><button id="howBtn">규칙</button><button id="resetBtn">처음부터</button></div>
  <p id="howText" style="display:none;font-size:13px;text-align:left"></p>
</div></div>

// 안개등 core — 7x7 bitmaps, jamo, objects, ops, recognition.
// Shared by the offline generator (Node) and the game (browser).
(function (root) {
  const N = 7;
  // bitmap = {hi, lo}: hi = bits for cells 0..27 (rows 0-3), lo = cells 28..48 (rows 4-6)
  const parse = rows => {
    let hi = 0, lo = 0;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (rows[r][c] === '#') { const i = r * N + c; if (i < 28) hi |= (1 << i); else lo |= (1 << (i - 28)); }
    }
    return { hi: hi >>> 0, lo: lo >>> 0 };
  };

    let hi = 0, lo = 0;
    for (let i = 0; i < 49; i++) if (cells[i]) { if (i < 28) hi |= (1 << i); else lo |= (1 << (i - 28)); }

{"title":"소리","lines":["일기의 첫 장은 안개와 함께 끝났다.","등대지기는 매일 밤 같은 소리를 들었다고 적었다. 파도 소리는 아니었다."],"teach":"이제 사물을 돌릴 수 있다. 돌리면 다른 글자가 숨어 있을지 모른다."},"10":{"title":"발자국","lines":["그는 등불 곁을 떠나지 않았다.","그런데 아침마다 계단은 젖어 있었다. 바다에서 올라온 것처럼."],"teach":"부서진 조각들이 나타났다. 겹치기는 두 조각의 모양을 합친다."},"15":{"title":"편지","lines":["등대 안에 그 말고 누군가 있었다.","서랍 깊은 곳에서, 그가 쓴 적 없는 편지가 나왔다."],"teach":"파내기는 앞 사물에서 뒤 사물의 모양을 도려낸다. 뒤집기로 거울에 비춘 모양도 쓸 수 있다."},"20":{"title":"어둠","lines":["그는 처음으로 등불을 덮었다.","어둠 속에서 안개가 등대 안으로 들어왔다. 그리고 계단을 올라왔다."],"teach":"만든 모양을 간직하면 새 사물이 된다. 두 번 겹쳐야 나오는 글자가 있다."},"25":{"title":"이름","lines":["그는 자신과 같은 얼굴을 한 사람과 마주 앉았다.","그 사람은 그가 잊은 이름들을 하나씩 불러 주었다."],"teach":"사물을 한 칸씩 밀 수 있다. 자리가 맞아야 글자가 된다."},"30":{"title":"다음 등대지기","lines":["일기는 여기서 끝난다.","등불은 아직 켜져 있다. 그리고 당신은 이 글자들을 읽을 수 있는 사람이다.","안개가 걷히는 밤이면, 바다 쪽을 보라."]}}, art: {"0":["....................................",".................o..................","................###.................","................#o#.....+...........","................###....+++..........",".................#......+...........","................###.................","................#.#.......++++......","................#.#......++++++.....","...............##.##....++++++++....","...............#...#...++++++++++...","..............##...##.++++++++++++..",".....++....##########################","....++++..#########################.","...++++++############################","####################################"],"5":["....................................","....................................",".................................#..","................................###.","................................#o#.","................................###.",".................................#..",".................o...............#..","................+.+..............#..","...............+...+............###.","..............+..+..+.........######",".............+..+.+..+..............","............+..+...+..+.............","...........+..+.....+..+............","+++++++++++++++++++++++++++++++++++.",".+++++++++++++++++++++++++++++++++++"],"10":["....................................","....................................","....................................",".........................######.....",".........................#..........",".....................o...#..........",".....................####...........",".....................#..............",".................o...#..............",".................####...............",".................#..................",".............o...#..................",".............####...................",".............#......................",".........o...#......................","#############......................."],"15":["....................................","....................................","............................o.......","...........................o.o......","............................o.......","............................#.......","............................#.......",".......################.....#.......",".......##............##....###......",".......#.##........##.#.....#.......",".......#...##....##...#.....#.......",".......#.....####.....#.....#.......",".......#..............#.....#.......",".......################.....#.......","............................#.......","####################################"],"20":["....................................","....................................","....................................","..........#############.............","..........#...........#.............","..........#.....+.....#.............","..........#....+++....#.............","..........#...+++++...#.............","..........#..+++++++..#.............","..........#.+++++++++.#.............","..........#+++++++++++#.............","..........#+++++++++++#........##...","..........#+++++++++++#........#o#..","..........#+++++++++++#........##...","..........#+++++++++++#........#....","####################################"],"25":["................ <script>
// 안개등 — 게임 본체
(function () {
  const C = window.FogCore, D = window.FOG_DATA;
  const $ = id => document.getElementById(id);
  const ACTS = D.acts, LEVELS = D.levels, STORY = D.story, SCENES = D.scenes;
  const ACT_NAMES = ['', '안개', '소리', '발자국', '편지', '어둠', '이름'];
  const OP_LABEL = { and: '비추기 ∩', or: '겹치기 ∪', sub: '파내기 −' };
  const SAVE_KEY = 'foglamp.save.v1';

  // ---------- 저장 ----------
  let save = { stage: 1, cleared: 0, sound: true, hints: {} };
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s && s.stage) save = Object.assign(save, s); } catch (e) { }
  const persist = () => { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { } };

  // ---------- 소리 (파일 없이 합성) ----------
  const Snd = (() => {
    let ctx = null, master = null, drone = null, noteTimer = null, on = save.sound !== false;
    const ensure = () => { if (ctx) return; ctx = new (window.AudioContext || window.webkitAudioContext)(); master = ctx.createGain(); master.gain.value = on ? 1 : 0; master.connect(ctx.destination); startDrone(); };
    const startDrone = () => {
      const g = ctx.createGain(); g.gain.value = 0.045; g.connect(master);
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 220; lp.connect(g);
      [55, 55.7, 82.4].forEach((f, i) => { const o = ctx.createOscillator(); o.type = i === 2 ? 'triangle' : 'sine'; o.frequency.value = f; const og = ctx.createGain(); og.gain.value = i === 2 ? 0.25 : 1; o.connect(og); og.connect(lp); o.start(); });
      // 안개 바람: 잡음
      const len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(); src.buffer = buf; src.loop = true;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 300; bp.Q.value = 0.6;
      const ng = ctx.createGain(); ng.gain.value = 0.018; src.connect(bp); bp.connect(ng); ng.connect(master); src.start();
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.05; const lg = ctx.createGain(); lg.gain.value = 0.012; lfo.connect(lg); lg.connect(ng.gain); lfo.start();
      drone = g; scheduleNote();
    };
    const NOTES = [110, 130.8, 146.8, 164.8, 196, 220, 261.6];
    const scheduleNote = () => { noteTimer = setTimeout(() => { if (on) piano(NOTES[Math.floor(Math.random() * NOTES.length)], 0.12, 5); scheduleNote(); }, 7000 + Math.random() * 9000); };
    const tone = (f, type, t0, dur, vol, dest) => { const o = ctx.createOscillator(); o.type = type; o.frequency.value = f; const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur); o.connect(g); g.connect(dest || master); o.start(t0); o.stop(t0 + dur + 0.05); };
    const echo = () => { const dl = ctx.createDelay(1.0); dl.delayTime.value = 0.38; const fb = ctx.createGain(); fb.gain.value = 0.35; const wet = ctx.createGain(); wet.gain.value = 0.5; dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(master); return dl; };
    const piano = (f, vol, dur) => { const t = ctx.currentTime; const e = echo(); const g = ctx.createGain(); g.gain.value = 1; g.connect(master); g.connect(e); tone(f, 'triangle', t, dur, vol, g); tone(f * 2, 'sine', t, dur * 0.6, vol * 0.3, g); tone(f * 3, 'sine', t, dur * 0.3, vol * 0.08, g); };
    const bell = (f, t, vol, dur) => { const e = echo(); const g = ctx.createGain(); g.gain.value = 1; g.connect(master); g.connect(e); [[1, 1], [2.76, .5], [5.4, .25], [8.9, .1]].forEach(([m, a]) => tone(f * m, 'sine', t, dur / (1 + m * 0.3), vol * a, g)); };
    const api = {
      unlock() { ensure(); if (ctx.state === 'suspended') ctx.resume(); },
      toggle() { on = !on; save.sound = on; persist(); if (ctx) master.gain.setTargetAtTime(on ? 1 : 0, ctx.currentTime, 0.05); return on; },
      isOn() { return on; },
      tap() { if (!ctx || !on) return; const t = ctx.currentTime; tone(1800, 'square', t, 0.03, 0.03); },
      place() { if (!ctx || !on) return; const t = ctx.currentTime; tone(520, 'sine', t, 0.12, 0.08); tone(780, 'sine', t + 0.02, 0.1, 0.04); },
      op() { if (!ctx || !on) return; const t = ctx.currentTime; tone(330, 'triangle', t, 0.15, 0.06); },
      found() { if (!ctx || !on) return; const t = ctx.currentTime; bell(880, t, 0.16, 2.2); bell(1318, t + 0.08, 0.1, 1.8); },
      again() { if (!ctx || !on) return; const t = ctx.currentTime; tone(660, 'sine', t, 0.2, 0.05); },
      wrong() { if (!ctx || !on) return; const t = ctx.currentTime; tone(72, 'sine', t, 0.5, 0.25); tone(60, 'triangle', t + 0.05, 0.4, 0.12); },
      clear() { if (!ctx || !on) return; const t = ctx.currentTime; [440, 554, 659, 880, 1108].forEach((f, i) => bell(f, t + i * 0.13, 0.14, 2.5)); },
      scene() { if (!ctx || !on) return; const t = ctx.currentTime; piano(110, 0.15, 6); tone(55, 'sine', t, 4, 0.12); },
    };
    return api;
  })();

  // ---------- 그리기 ----------
  const drawBits = (cv, b, opts) => {
    const o = Object.assign({ on: '#d8d5cf', off: 'rgba(255,255,255,.04)', dim: 1, glow: false }, opts || {});
    const ctx = cv.getContext('2d'); const S = cv.width; const cell = S / 7; ctx.clearRect(0, 0, S, S);
    for (let r = 0; r < 7; r++) for (let c = 0; c < 7; c++) {
      const v = b && C.get(b, r, c);
      ctx.fillStyle = v ? o.on : o.off; const pad = cell * 0.14;
      if (o.glow && v) { ctx.shadowColor = o.on; ctx.shadowBlur = cell * 0.6; } else ctx.shadowBlur = 0;
      ctx.fillRect(c * cell + pad, r * cell + pad, cell - pad * 2, cell - pad * 2);
    }
    ctx.shadowBlur = 0;
  };
  const prepCanvas = (cv, px) => { cv.width = px; cv.height = px; };

  // ---------- 상태 ----------
  let L = null, act = null, tools = null;
  let objects = []; // [{id, name, b, kept}]
  let slots = [null, null]; // {id, t:{rot,flip,dr,dc}}
  let selSlot = 0, op = 'and';
  let found = []; // jamo chars found this stage
  let fills = []; // per blank: [cho, jung, jong]
  let selJamo = null, selCell = null; // {bi, k}
  let keptCount = 0, hintsUsed = 0;
  let lastResult = null;

  const toolsFor = a => ({ ops: ACTS[a].ops, rot: !!ACTS[a].rot, flip: !!ACTS[a].flip, shift: !!ACTS[a].shift, chain: !!ACTS[a].chain });

  function loadStage(n) {
    L = LEVELS[n - 1]; act = L.act; tools = toolsFor(act);
    objects = L.objects.map((name, i) => ({ id: 'o' + i, name, b: C.OBJECTS[name], kept: false }));
    slots = [null, null]; selSlot = 0; op = tools.ops[0]; found = []; selJamo = null; selCell = null; keptCount = 0; hintsUsed = 0; lastResult = null;
    fills = L.blanks.map(b => [null, null, b.t ? null : '']);
    $('stageLbl').textContent = `${n} / 30`;
    $('actLbl').textContent = `${act}막 · ${ACT_NAMES[act]}`;
    renderShelf(); renderOps(); renderTools(); renderSlots(); renderBoard(); renderNote(); renderPrev(); setMsg('');
    save.stage = n; persist();
  }

  // ---------- 선반 ----------
  function renderShelf() {
    const el = $('shelf'); el.innerHTML = '';
    objects.forEach(o => {
      const d = document.createElement('div'); d.className = 'obj' + (o.kept ? ' kept' : '');
      if (slots[0] && slots[0].id === o.id) d.classList.add('inA'); if (slots[1] && slots[1].id === o.id) d.classList.add('inB');
      const cv = document.createElement('canvas'); prepCanvas(cv, 84); drawBits(cv, o.b, { on: o.kept ? '#e8a94a' : '#cfcac2' });
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = o.name;
      d.appendChild(cv); d.appendChild(nm);
      d.addEventListener('click', () => { Snd.unlock(); placeObject(o); });
      el.appendChild(d);
    });
  }
  function placeObject(o) {
    let k = selSlot; if (slots[0] && !slots[1]) k = 1; else if (!slots[0]) k = 0;
    slots[k] = { id: o.id, t: { rot: 0, flip: 0, dr: 0, dc: 0 } }; selSlot = k;
    Snd.place(); renderShelf(); renderSlots(); renderTools(); evaluate();
  }
  const objOf = s => objects.find(o => o.id === s.id);
  const shapeOf = s => { const o = objOf(s); return o.kept ? o.b : C.transform(o.b, s.t); };

  // ---------- 작업대 ----------
  function renderOps() {
    const el = $('opBox'); el.innerHTML = '';
    tools.ops.forEach(k => { const b = document.createElement('button'); b.textContent = OP_LABEL[k]; if (k === op) b.classList.add('on'); b.addEventListener('click', () => { Snd.unlock(); op = k; Snd.op(); renderOps(); evaluate(); }); el.appendChild(b); });
  }
  function renderSlots() {
    ['slotA', 'slotB'].forEach((id, k) => {
      const el = $(id); const cv = el.querySelector('canvas'); prepCanvas(cv, 84); const s = slots[k];
      el.classList.toggle('sel', selSlot === k);
      drawBits(cv, s ? shapeOf(s) : null, { on: '#cfcac2' });
      el.querySelector('.nm').textContent = s ? objOf(s).name : '';
    });
  }
  ['slotA', 'slotB'].forEach((id, k) => $(id).addEventListener('click', () => { Snd.unlock(); selSlot = k; Snd.tap(); renderSlots(); renderTools(); }));
  function renderTools() {
    const el = $('tools'); el.innerHTML = '';
    const s = slots[selSlot]; const keptSel = s && objOf(s).kept;
    const mk = (label, fn, dis) => { const b = document.createElement('button'); b.textContent = label; b.disabled = !!dis; b.addEventListener('click', () => { Snd.unlock(); fn(); }); el.appendChild(b); return b; };
    if (tools.rot) mk('돌리기 ↻', () => xform(t => { t.rot = (t.rot + 1) % 4; }), !s || keptSel);
    if (tools.flip) mk('뒤집기 ⇋', () => xform(t => { t.flip = t.flip ? 0 : 1; }), !s || keptSel);
    if (tools.shift) { [['←', 0, -1], ['→', 0, 1], ['↑', -1, 0], ['↓', 1, 0]].forEach(([l, dr, dc]) => mk(l, () => xform(t => { t.dr += dr; t.dc += dc; }), !s || keptSel)); }
    mk('비우기', () => { if (!s) return; slots[selSlot] = null; Snd.tap(); renderShelf(); renderSlots(); renderTools(); evaluate(); }, !s);
    if (tools.chain) { const b = mk('간직하기 ✦', keepResult, !(lastResult && !C.isEmpty(lastResult)) || keptCount >= 3); b.id = 'keep'; b.classList.add('primary'); }
  }
  function xform(fn) {
    const s = slots[selSlot]; if (!s) return; const o = objOf(s); if (o.kept) return;
    const t = Object.assign({}, s.t); fn(t);
    if (t.dr) t.dr = Math.max(-3, Math.min(3, t.dr)); if (t.dc) t.dc = Math.max(-3, Math.min(3, t.dc));
    const nb = C.transform(o.b, t);
    if (C.count(nb) !== C.count(o.b)) { $('slots').classList.remove('shake'); void $('slots').offsetWidth; $('slots').classList.add('shake'); setMsg('사물은 판 밖으로 나가지 않는다.'); Snd.wrong(); return; }
    s.t = t; Snd.op(); renderSlots(); evaluate();
  }
  function keepResult() {
    if (!lastResult || C.isEmpty(lastResult) || keptCount >= 3) return;
    keptCount++; const id = 'k' + keptCount;
    objects.push({ id, name: '간직 ' + keptCount, b: lastResult, kept: true });
    Snd.place(); setMsg('모양을 간직했다. 탁자 위에 새 사물이 놓였다.'); renderShelf(); renderTools();
  }
  const dotsEl = $('dots'); for (let i = 0; i < 7; i++) dotsEl.appendChild(document.createElement('i'));
  function renderBoard(b, jamo) {
    const cv = $('boardCv'); prepCanvas(cv, 280);
    if (!b) { drawBits(cv, null); return; }
    drawBits(cv, b, { on: jamo ? '#f6c976' : '#e8a94a', glow: true });
  }
  function evaluate() {
    const A = slots[0] && shapeOf(slots[0]), B = slots[1] && shapeOf(slots[1]);
    const dots = [...dotsEl.children];
    if (!A || !B) { lastResult = null; renderBoard(A || B ? (A || B) : null); if (A || B) { const cv = $('boardCv'); drawBits(cv, A || B, { on: 'rgba(216,213,207,.35)' }); } dots.forEach(d => d.classList.remove('on')); renderTools(); return; }
    const r = C.OPS[op](A, B); lastResult = r;
    const j = C.recognize(r);
    renderBoard(r, !!j);
    const near = C.isEmpty(r) ? 99 : C.nearest(r).d; const lit = j ? 7 : Math.max(0, 7 - near);
    dots.forEach((d, i) => d.classList.toggle('on', i < lit));
    renderTools();
    if (j) {
      const bd = $('board'); bd.classList.remove('flash'); void bd.offsetWidth; bd.classList.add('flash'); setTimeout(() => bd.classList.remove('flash'), 900);
      if (!found.includes(j)) { found.push(j); Snd.found(); setMsg(`빛이 「${j}」 모양으로 통과했다.`, 'good'); renderTray(j); }
      else { Snd.again(); }
    }
  }

  // ---------- 노트 ----------
  function renderPrev() {
    const el = $('prev'); el.innerHTML = '';
    const from = Math.max(0, L.n - 4);
    for (let i = from; i < L.n - 1; i++) { const d = document.createElement('div'); d.textContent = `${i + 1}. ` + STORY[i].replace(/【|】/g, ''); el.appendChild(d); }
  }
  function renderNote() {
    const el = $('line'); el.innerHTML = '';
    const pre = document.createElement('span'); pre.textContent = `${L.n}. `; pre.style.color = 'var(--ink3)'; el.appendChild(pre);
    L.segs.forEach(seg => {
      if (seg.t !== undefined) { el.appendChild(document.createTextNode(seg.t)); return; }
      const bi = seg.blank, bl = L.blanks[bi], f = fills[bi];
      const s = document.createElement('span'); s.className = 'syl';
      const parts = bl.t ? 3 : 2;
      for (let k = 0; k < parts; k++) {
        const c = document.createElement('span'); c.className = 'js'; c.textContent = f[k] || '';
        if (selCell && selCell.bi === bi && selCell.k === k) c.classList.add('sel');
        c.addEventListener('click', e => { e.stopPropagation(); Snd.unlock(); Snd.tap(); onCell(bi, k); });
        s.appendChild(c);
      }
      const full = f[0] && f[1] && (parts === 2 || f[2]); if (full) s.classList.add('ok');
      el.appendChild(s);
    });
    renderTray();
  }
  function renderTray(newJ) {
    const el = $('tray'); el.innerHTML = '';
    found.forEach(j => { const d = document.createElement('div'); d.className = 'jm' + (selJamo === j ? ' sel' : '') + (j === newJ ? ' new' : ''); d.textContent = j; d.addEventListener('click', () => { Snd.unlock(); Snd.tap(); onJamo(j); }); el.appendChild(d); });
    if (!found.length) { const d = document.createElement('div'); d.className = 'small'; d.textContent = '찾은 글자가 여기에 모인다.'; el.appendChild(d); }
  }
  const cellAccepts = (k, j) => k === 1 ? C.VOWELS.includes(j) : C.CONSONANTS.includes(j);
  function onJamo(j) {
    if (selCell) { if (cellAccepts(selCell.k, j)) { fills[selCell.bi][selCell.k] = j; selCell = nextCell(selCell); } else { Snd.wrong(); setMsg(selCell.k === 1 ? '가운데 칸에는 모음이 들어간다.' : '그 칸에는 자음이 들어간다.', 'bad'); }
      renderNote(); return; }
    selJamo = selJamo === j ? null : j; renderTray();
  }
  function onCell(bi, k) {
    if (selJamo) { if (cellAccepts(k, selJamo)) { fills[bi][k] = selJamo; selJamo = null; } else { Snd.wrong(); setMsg(k === 1 ? '가운데 칸에는 모음이 들어간다.' : '그 칸에는 자음이 들어간다.', 'bad'); } renderNote(); return; }
    if (fills[bi][k]) { fills[bi][k] = null; selCell = null; renderNote(); return; }
    selCell = (selCell && selCell.bi === bi && selCell.k === k) ? null : { bi, k }; renderNote();
  }
  function nextCell(cur) { // 같은 글자 안에서 다음 빈 칸
    const parts = L.blanks[cur.bi].t ? 3 : 2;
    for (let k = cur.k + 1; k < parts; k++) if (!fills[cur.bi][k]) return { bi: cur.bi, k };
    for (let bi = cur.bi + 1; bi < L.blanks.length; bi++) { const p = L.blanks[bi].t ? 3 : 2; for (let k = 0; k < p; k++) if (!fills[bi][k]) return { bi, k }; }
    return null;
  }
  $('clearBtn').addEventListener('click', () => { Snd.unlock(); Snd.tap(); fills = L.blanks.map(b => [null, null, b.t ? null : '']); selCell = null; selJamo = null; renderNote(); setMsg(''); });
  $('decodeBtn').addEventListener('click', () => { Snd.unlock(); decode(); });
  function decode() {
    let empty = 0, wrong = 0;
    L.blanks.forEach((bl, i) => { const f = fills[i]; const parts = bl.t ? 3 : 2; if (!f[0] || !f[1] || (parts === 3 && !f[2])) { empty++; return; } const ch = C.compose(f[0], f[1], parts === 3 ? f[2] : ''); if (ch !== bl.ch) wrong++; });
    if (empty) { setMsg(`아직 빈 칸이 ${empty}글자 있다.`, 'bad'); Snd.wrong(); return; }
    if (wrong) { setMsg(`${wrong}글자가 아직 안개 속에 있다.`, 'bad'); Snd.wrong(); const el = $('line'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); return; }
    // 해독 성공
    Snd.clear(); setMsg('안개가 걷혔다.', 'good');
    [...document.querySelectorAll('.syl')].forEach((s, i) => { s.className = 'syl done'; s.textContent = L.blanks[i].ch; });
    save.cleared = Math.max(save.cleared, L.n); persist();
    if (!window.__fog || window.__fog.auto !== false) setTimeout(() => { const next = L.n + 1; if (SCENES[L.n]) showScene(L.n, () => { if (next <= 30) loadStage(next); else showStart(true); }); else if (next <= 30) loadStage(next); }, 1600);
  }
  function setMsg(t, cls) { const m = $('msg'); m.textContent = t; m.className = cls || ''; }

  // ---------- 힌트 ----------
  $('hintBtn').addEventListener('click', () => {
    Snd.unlock(); Snd.tap();
    const missing = L.req.filter(j => !found.includes(j));
    if (!missing.length) { setMsg('필요한 글자는 이미 다 찾았다. 노트를 채워 보자.'); return; }
    if (hintsUsed >= 3) { setMsg('등불의 기름이 모자라다. 힌트는 단계마다 세 번뿐이다.', 'bad'); return; }
    hintsUsed++; save.hints[L.n] = (save.hints[L.n] || 0) + 1; persist();
    const j = missing[Math.floor(Math.random() * missing.length)]; const r = L.recipes[j];
    let t;
    if (r.chain) t = `「${j}」는 간직한 모양이 필요하다. 「${r.chain.a}」와 「${r.chain.b2}」로 만든 모양에 「${r.c}」를 ${OP_LABEL[r.op].split(' ')[0]}.`;
    else { const objs = r.a === r.b ? `「${r.a}」 두 개` : `「${r.a}」와 「${r.b}」`; const tr = []; if (r.ta.rot || r.tb.rot) tr.push('돌리기'); if (r.ta.flip || r.tb.flip) tr.push('뒤집기'); if (r.ta.dr || r.ta.dc || r.tb.dr || r.tb.dc) tr.push('밀기'); t = `「${j}」: ${objs}를 ${OP_LABEL[r.op].split(' ')[0]}${tr.length ? ' (' + tr.join('·') + ' 필요)' : ''}.`; }
    setMsg(`힌트 ${hintsUsed}/3 — ` + t, 'good');
  });

  // ---------- 장면 ----------
  function drawScene(key) {
    const art = D.art[key]; const cv = $('sceneCv'); if (!art) { cv.style.display = 'none'; return; } cv.style.display = 'block';
    const W = art[0].length, H = art.length, px = 10; cv.width = W * px; cv.height = H * px; const ctx = cv.getContext('2d');
    ctx.fillStyle = '#0f1012'; ctx.fillRect(0, 0, cv.width, cv.height);
    for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) { const ch = art[r][c]; if (ch === '.') continue; ctx.fillStyle = ch === 'o' ? '#e8a94a' : ch === '+' ? '#3a3d44' : '#9a978f'; if (ch === 'o') { ctx.shadowColor = '#e8a94a'; ctx.shadowBlur = 12; } else ctx.shadowBlur = 0; ctx.fillRect(c * px + 1, r * px + 1, px - 2, px - 2); }
    ctx.shadowBlur = 0;
  }
  function showScene(key, then) {
    const sc = SCENES[key]; $('sceneTitle').textContent = sc.title; $('sceneText').innerHTML = sc.lines.map(l => l).join('<br>');
    const te = $('sceneTeach'); if (sc.teach) { te.style.display = 'block'; te.textContent = sc.teach; } else te.style.display = 'none';
    drawScene(key); $('scene').classList.add('show'); Snd.scene();
    $('sceneBtn').onclick = () => { Snd.tap(); $('scene').classList.remove('show'); then && then(); };
  }

  // ---------- 화면 전환 ----------
  function showStart(ending) {
    $('app').classList.remove('show'); $('start').classList.add('show');
    $('contBtn').style.display = save.cleared >= 1 && save.cleared < 30 ? '' : 'none';
    if (ending) { $('startBtn').textContent = '다시 처음부터'; }
  }
  function begin(fromStage) {
    $('start').classList.remove('show'); $('app').classList.add('show');
    if (fromStage === 1) showScene(0, () => loadStage(1)); else loadStage(fromStage);
  }
  $('startBtn').addEventListener('click', () => { Snd.unlock(); Snd.tap(); save.cleared = 0; save.hints = {}; persist(); begin(1); });
  $('contBtn').addEventListener('click', () => { Snd.unlock(); Snd.tap(); begin(Math.min(30, save.cleared + 1)); });
  const goFull = () => { const el = document.documentElement; const f = el.requestFullscreen || el.webkitRequestFullscreen; if (f) { try { const p = f.call(el); if (p && p.then) p.then(() => { try { screen.orientation.lock('landscape').catch(() => { }); } catch (e) { } }).catch(() => { }); } catch (e) { } } };
  $('fsBtn').addEventListener('click', goFull); $('fsBtn2').addEventListener('click', goFull);
  $('soundBtn').addEventListener('click', () => { Snd.unlock(); const on = Snd.toggle(); $('soundBtn').classList.toggle('on', !on); $('soundBtn').textContent = on ? '소리' : '소리 꺼짐'; });
  if (save.sound === false) { $('soundBtn').classList.add('on'); $('soundBtn').textContent = '소리 꺼짐'; }
  $('menuBtn').addEventListener('click', () => { Snd.tap(); $('menuInfo').textContent = `${L.n}단계 · ${act}막 ${ACT_NAMES[act]} · 힌트 ${hintsUsed}/3`; $('howText').style.display = 'none'; $('menu').classList.add('show'); });
  $('resumeBtn').addEventListener('click', () => { Snd.tap(); $('menu').classList.remove('show'); });
  $('restartStageBtn').addEventListener('click', () => { Snd.tap(); $('menu').classList.remove('show'); loadStage(L.n); });
  $('resetBtn').addEventListener('click', () => { Snd.tap(); $('menu').classList.remove('show'); save.cleared = 0; save.hints = {}; persist(); showStart(); $('startBtn').textContent = '처음부터'; });
  $('howBtn').addEventListener('click', () => { const h = $('howText'); h.style.display = h.style.display === 'none' ? 'block' : 'none'; h.innerHTML = ['<b>규칙</b> 탁자 위의 물건을 앞·뒤 자리에 올리면 빛판에 모양이 찍힌다. 그 모양이 한글 자모와 정확히 같으면(자리는 상관없다) 노트의 쟁반에 들어온다. 쟁반의 자모로 일기의 빈 글자를 채우고 「해독」을 누른다. 문장 전체가 맞아야 안개가 걷힌다.', '<b>비추기 ∩</b> 두 사물이 모두 뚫린 곳만 남는다. <b>겹치기 ∪</b> 두 모양을 합친다. <b>파내기 −</b> 앞 사물에서 뒤 사물의 모양을 도려낸다.', '<b>돌리기·뒤집기·밀기</b> 선택한 자리의 사물을 바꾼다. 사물은 판 밖으로 나가지 않는다. <b>간직하기</b> 빛판의 모양을 새 사물로 만든다(단계마다 셋). 간직한 모양은 돌리거나 밀 수 없다.', '점 일곱 개는 가장 가까운 글자까지 남은 칸 수를 알려 준다. 힌트는 단계마다 세 번.'].join('<br><br>'); });


  // 검증용 훅 (자동 풀이 테스트)
  window.__fog = {
    load: loadStage,
    place(name, k, t) { const o = objects.find(x => x.name === name); if (!o) throw new Error('no obj ' + name); slots[k] = { id: o.id, t: Object.assign({ rot: 0, flip: 0, dr: 0, dc: 0 }, t || {}) }; selSlot = k; renderShelf(); renderSlots(); renderTools(); evaluate(); },
    setOp(k) { op = k; renderOps(); evaluate(); },
    keep: keepResult,
    fill(bi, k, j) { fills[bi][k] = j; renderNote(); },
    decode,
    state() { return { n: L.n, found: found.slice(), req: L.req.slice(), blanks: L.blanks, msg: $('msg').textContent, kept: keptCount }; },
  };
  // 진행 상황
  if (save.cleared >= 30) $('startBtn').textContent = '다시 처음부터';
  showStart(false);
})();

</script>
