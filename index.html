<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>안개등 — 비 오는 항구의 탐정 이야기</title>
<meta name="description" content="흑백 느와르 퍼즐. 방 안의 물건을 끌어 겹치면 글자가 떠오른다. 사라진 등대지기를 찾아라.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Myeongjo:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{--red:#c9282d;--ink:#e9e4d8;--dim:#8c877c;--dim2:#4a4740;--font:'Nanum Myeongjo','Gowun Batang','Noto Serif KR','Apple SD Gothic Neo',serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:var(--font)}
body{position:fixed;inset:0;width:100%;height:100dvh}
#cv{position:absolute;display:block;touch-action:none}
#stage{position:absolute;pointer-events:none;overflow:hidden}
#stage > *{pointer-events:auto}
button{font-family:inherit;color:var(--ink);background:rgba(0,0,0,.55);border:1px solid var(--dim2);border-radius:.2em;padding:.45em .9em;cursor:pointer;letter-spacing:.14em;font-size:.85em;line-height:1.2}
button:active{transform:translateY(1px)}
button:disabled{opacity:.35;cursor:default}
button.primary{border-color:var(--red);color:#fff}
button.ghost{border-color:transparent;background:none;color:var(--dim)}
.ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:auto}
.ov.show{display:flex}
/* HUD */
#hud{position:absolute;inset:0;display:none;pointer-events:none}
#hud.show{display:block}
#hud > *{pointer-events:auto}
#roomTitle{position:absolute;left:1.4em;top:1em;font-size:.8em;letter-spacing:.35em;color:var(--dim);pointer-events:none}
#hudBtns{position:absolute;right:1.2em;top:.9em;display:flex;gap:.5em}
#hudBtns button{padding:.35em .8em;font-size:.75em;letter-spacing:.2em}
#hintBtn{opacity:.35}#hintBtn.avail{opacity:1;border-color:var(--red)}
#noteBtn{position:absolute;right:1.2em;bottom:1em;width:3.6em;height:3.6em;border-radius:50%;border:1px solid var(--dim2);background:rgba(0,0,0,.6);font-size:1em;letter-spacing:0;padding:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:.1em}
#noteBtn small{font-size:.55em;letter-spacing:.2em;color:var(--dim)}
#noteBtn.pulse{border-color:var(--red);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(201,40,45,.6)}50%{box-shadow:0 0 0 .7em rgba(201,40,45,0)}}
#toast{position:absolute;left:50%;bottom:1.4em;transform:translateX(-50%);font-size:1.6em;color:var(--red);letter-spacing:.3em;opacity:0;pointer-events:none;text-shadow:0 0 .4em rgba(201,40,45,.6)}
#toast.show{animation:toast 2s ease forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,.4em)}15%{opacity:1;transform:translate(-50%,0)}75%{opacity:1}100%{opacity:0}}
/* 수첩 */
#note{background:rgba(0,0,0,.86)}
.paper{width:min(92%,46em);max-height:92%;background:#0e0e0e;border:1px solid #2b2925;padding:1.4em 1.8em;display:grid;grid-template-columns:1.25fr 1fr;gap:1.2em 2em;font-size:1em;position:relative;overflow:hidden}
.paper h3{margin:0 0 .5em;font-size:.72em;letter-spacing:.4em;color:var(--dim);font-weight:400}
.paper .close{position:absolute;right:.8em;top:.6em;border:none;background:none;color:var(--dim);font-size:1.1em;padding:.2em .4em}
.clue{font-size:.95em;line-height:1.7;letter-spacing:.06em;word-break:keep-all;color:var(--ink);margin-bottom:.6em}
.wordbox{display:flex;gap:.5em;flex-wrap:wrap}
.syl{display:inline-flex;gap:.15em;border:1px solid var(--dim2);border-radius:.25em;padding:.2em .25em}
.js{width:1.5em;height:2.1em;border-radius:.15em;background:#181818;display:flex;align-items:center;justify-content:center;font-size:1.05em;color:#fff;cursor:pointer}
.js.sel{outline:1px solid var(--red);background:rgba(201,40,45,.18)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-.3em)}75%{transform:translateX(.3em)}}
#noteChips{display:flex;flex-wrap:wrap;gap:.4em;min-height:2.4em;margin:.5em 0}
.chip{min-width:2.2em;height:2.2em;padding:0 .5em;border:1px solid var(--red);color:#fff;border-radius:.2em;display:flex;align-items:center;justify-content:center;font-size:1.05em;cursor:pointer;background:rgba(201,40,45,.12)}
.chip.sel{background:var(--red)}
.dim{color:var(--dim);font-size:.85em;letter-spacing:.05em}
#noteBtns{display:flex;gap:.5em;align-items:center;margin-top:.4em}
#noteMsg{font-size:.85em;color:var(--red);min-height:1.4em;margin-top:.5em;letter-spacing:.05em;word-break:keep-all}
#notePocket{display:flex;flex-wrap:wrap;gap:.4em;margin-bottom:.8em}
.pk{border:1px dashed var(--dim2);padding:.2em .6em;font-size:.85em;color:var(--ink)}
#noteHist{font-size:.85em;color:var(--dim);line-height:1.8;letter-spacing:.05em;margin-bottom:.8em}
#noteHint{font-size:.88em;line-height:1.7;color:var(--ink);letter-spacing:.04em;word-break:keep-all;margin-top:.5em}
/* 장 마무리 */
#chapter{background:rgba(0,0,0,.92)}
#chapter .paper{grid-template-columns:1fr;text-align:center;gap:.8em}
#chSentence{font-size:1.35em;line-height:2.1;letter-spacing:.06em;word-break:keep-all}
.blank{display:inline-block;min-width:3.2em;border-bottom:2px solid var(--dim);margin:0 .15em;padding:0 .3em;cursor:pointer;color:#fff}
.blank.sel{border-color:var(--red)}.blank.filled{border-color:var(--red);color:var(--red)}
#chWords{display:flex;justify-content:center;gap:.5em;flex-wrap:wrap;margin:.4em 0}
#chMsg{color:var(--red);font-size:.9em;min-height:1.4em}
/* 장면 */
#scene{display:none;flex-direction:column;justify-content:flex-end;align-items:center;cursor:pointer}
#scene.show{display:flex}
#sceneCap{width:min(86%,60em);text-align:center;font-size:1.25em;line-height:1.9;letter-spacing:.1em;word-break:keep-all;color:var(--ink);margin-bottom:2.6em;min-height:4.2em;text-shadow:0 2px 12px #000}
@media (max-height:480px){#sceneCap{font-size:1.05em;margin-bottom:1.6em;min-height:3em}#sceneCap.big{font-size:2em}#title h1{font-size:3em}.paper{padding:1em 1.2em;gap:.8em 1.4em}}
#sceneCap.big{font-size:2.6em;letter-spacing:.5em;font-weight:800;margin-bottom:1.4em}
#sceneCap.red{color:var(--red)}
#sceneHint{position:absolute;right:2em;bottom:1.2em;font-size:.7em;letter-spacing:.3em;color:var(--dim);opacity:0;transition:opacity .6s}
/* 타이틀 */
#title{background:transparent;flex-direction:column;gap:1.2em;text-align:center}
#title h1{margin:0;font-size:4.4em;letter-spacing:.6em;text-indent:.6em;font-weight:800;color:var(--ink)}
#title .sub{font-size:.85em;letter-spacing:.5em;color:var(--dim)}
#title .btns{display:flex;gap:.8em;margin-top:1em}
#title .btns button{padding:.7em 1.6em;font-size:.9em}
#title .foot{position:absolute;bottom:1.4em;font-size:.68em;letter-spacing:.3em;color:var(--dim2)}
#title .redline{width:6em;height:2px;background:var(--red)}
/* 선택 */
#choice{background:rgba(0,0,0,.9);flex-direction:column;gap:1.5em;text-align:center}
#choice p{margin:0;font-size:1.3em;line-height:1.9;letter-spacing:.1em;word-break:keep-all;max-width:36em}
#choice .btns{display:flex;gap:1.2em}
#choice .btns button{padding:.9em 1.6em;font-size:1em;letter-spacing:.25em}
/* 메뉴 */
#menu{background:rgba(0,0,0,.9)}
#menu .paper{grid-template-columns:1fr;text-align:center;width:min(80%,30em)}
#menu .row{display:flex;gap:.6em;justify-content:center;flex-wrap:wrap}
#menu p{font-size:.9em;line-height:1.8;letter-spacing:.05em;word-break:keep-all;color:var(--dim);text-align:left}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .9s}
#fade.show{opacity:1;pointer-events:auto}
#rotate{display:none;position:fixed;inset:0;background:#000;z-index:50;align-items:center;justify-content:center;text-align:center;color:var(--dim);letter-spacing:.2em;line-height:2.2;padding:20px;word-break:keep-all}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="stage">
  <div id="hud">
    <div id="roomTitle"></div>
    <div id="hudBtns"><button id="hintBtn">힌트</button><button id="fsBtn">전체화면</button><button id="menuBtn">메뉴</button></div>
    <button id="noteBtn">✎<small>수첩</small></button>
    <div id="toast"></div>
  </div>

  <div class="ov" id="note"><div class="paper">
    <button class="close" id="noteClose">✕</button>
    <div>
      <h3>사건 낱말</h3>
      <div id="noteWord"></div>
      <h3 style="margin-top:.8em">떠오른 글자</h3>
      <div id="noteChips"></div>
      <div id="noteBtns"><button id="noteCheck" class="primary">확인</button><button id="noteClear" class="ghost">비우기</button></div>
      <div id="noteMsg"></div>
    </div>
    <div>
      <h3>증거 봉투</h3>
      <div id="notePocket"></div>
      <h3>지금까지</h3>
      <div id="noteHist"></div>
      <h3>힌트</h3>
      <button id="noteHintBtn"></button>
      <div id="noteHint"></div>
    </div>
  </div></div>

  <div class="ov" id="chapter"><div class="paper">
    <h3 id="chTitle"></h3>
    <div id="chSentence"></div>
    <div id="chWords"></div>
    <div id="chMsg"></div>
    <div><button id="chBtn" class="primary">이렇게 적는다</button></div>
  </div></div>

  <div class="ov" id="scene"><div id="sceneCap"></div><div id="sceneHint">탭하여 계속</div></div>

  <div class="ov show" id="title">
    <div class="sub">비 오는 항구의 탐정 이야기</div>
    <h1>안개등</h1>
    <div class="redline"></div>
    <div class="btns"><button class="primary" id="startBtn">새 사건</button><button id="contBtn">이어서</button><button id="fsBtn2">전체화면</button></div>
    <div class="foot">소리를 켜고 · 가로 화면으로 · 설명은 없다</div>
  </div>

  <div class="ov" id="choice">
    <p id="choiceText"></p>
    <div class="btns"><button id="choiceA"></button><button id="choiceB"></button></div>
  </div>

  <div class="ov" id="menu"><div class="paper">
    <h3>안개등</h3>
    <div class="row"><button id="menuClose" class="primary">돌아가기</button><button id="soundBtn">소리 끄기</button><button id="restartRoomBtn">이 방 다시</button><button id="toTitleBtn">제목으로</button><button id="resetBtn">처음부터</button></div>
    <p>물건을 끌어 옮기고, 한 번 두드리면 고른다. 고른 물건 둘레의 고리를 끌면 돌아간다(마우스 휠도 된다). 두 물건이 정확히 겹치면 글자가 떠오르고, 잠시 그대로 두면 수첩에 적힌다. 수첩에서 글자로 사건 낱말을 만들고, 장이 끝날 때 추리 문장을 완성한다. 힌트는 시간이 지나면 열린다.</p>
  </div></div>

  <div id="fade"></div>
</div>
<div id="rotate"><div>안개등은 가로 화면에서만 켜집니다.<br><span style="font-size:.8em">기기를 옆으로 돌려 주세요.</span></div></div>

      const sc = S.cv || (S.cv = document.createElement('canvas')); sc.width = W; sc.height = bandH; const x = sc.getContext('2d'); x.clearRect(0, 0, W, bandH);
